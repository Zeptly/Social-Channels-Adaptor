# Railway config-as-code for the Worker service (see docs/RAILWAY.md).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["apps/worker/**", "packages/**", "migrations/**", "package.json", "pnpm-lock.yaml", "Dockerfile"]

[deploy]
# Migrations are idempotent and advisory-locked, so both services may run them.
preDeployCommand = ["node apps/worker/dist/migrate.js"]
startCommand = "node apps/worker/dist/main.js"
restartPolicyType = "ALWAYS"
