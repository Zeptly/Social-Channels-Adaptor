name: Live Outstand validation (manual)

# Separately invoked; never part of normal CI. Uses the PAYG account secrets.
on:
  workflow_dispatch:
    inputs:
      allow_publish:
        description: "Allow writes (schedule+delete) to the dedicated test account"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: outstand-live
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Live suite
        env:
          OUTSTAND_LIVE_TESTS: "true"
          OUTSTAND_LIVE_API_KEY: ${{ secrets.OUTSTAND_LIVE_API_KEY }}
          OUTSTAND_LIVE_TEST_ACCOUNT_ID: ${{ secrets.OUTSTAND_LIVE_TEST_ACCOUNT_ID }}
          OUTSTAND_LIVE_ALLOW_PUBLISH: ${{ inputs.allow_publish && 'true' || 'false' }}
        run: pnpm test:live
