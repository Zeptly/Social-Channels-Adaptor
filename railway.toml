# Railway config-as-code for the API service (see docs/RAILWAY.md).
# The worker service uses railway/worker.toml (set "Railway Config File" on that service).
# No secrets here: all variables are set per service in Railway.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["apps/api/**", "packages/**", "migrations/**", "package.json", "pnpm-lock.yaml", "Dockerfile"]

[deploy]
preDeployCommand = ["node apps/api/dist/migrate.js"]
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
